services:
    postgres:
        image: postgres:18-alpine
        container_name: postgres_db
        # restart: unless-stopped
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: mypassword
            POSTGRES_DB: mydb
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql/data
volumes:
        pgdata: